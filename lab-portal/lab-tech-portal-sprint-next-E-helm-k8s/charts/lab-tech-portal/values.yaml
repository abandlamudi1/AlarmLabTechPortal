# Default values for lab-tech-portal.
# Override per environment (e.g., values-prod.yaml).

image:
  repository: lab-tech-portal
  tag: "latest"
  pullPolicy: IfNotPresent

# Replica counts for each component.
# beat is intentionally omitted — it must run as a singleton (1 replica, fixed).
replicaCount:
  web: 2
  worker: 2

# Resource sizing for ~250 concurrent QEs.
resources:
  web:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  worker:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  beat:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

# HorizontalPodAutoscaler for the web Deployment.
hpa:
  web:
    minReplicas: 2
    maxReplicas: 10
    cpuTarget: 70
    memoryTarget: 80

# Ingress configuration.
ingress:
  enabled: true
  className: "nginx"
  host: "lab-portal.example.com"
  tls:
    enabled: true
    secretName: "lab-portal-tls"
  # cert-manager ClusterIssuer name for automated TLS certificate provisioning.
  clusterIssuer: "letsencrypt-prod"

# ── Non-secret runtime configuration ──────────────────────────────────────────
# These values are injected into the ConfigMap. All secret values
# (SECRET_KEY, OKTA_CLIENT_SECRET, JIRA_PAT, S3_ACCESS_KEY, S3_SECRET_KEY,
# ATLASSIAN_MCP_TOKEN, SYSTEM_LOCATOR_DELETE_PIN) are managed via SealedSecrets
# (issue #51) and are NOT present here.

config:
  # Flask core
  FLASK_ENV: "production"
  # DATA_DIR: tools still write SQLite DBs and file uploads under this path.
  # With multiple web replicas, each pod uses isolated ephemeral storage unless a
  # PersistentVolume is mounted at /data. Full persistence is tracked in issue #73
  # (Postgres + S3 migration). Do not scale web beyond 1 replica until #73 lands.
  DATA_DIR: "/data"
  LOG_LEVEL: "INFO"
  LOG_FORMAT: "json"
  STRUCTLOG_ENABLED: "true"
  LOGIN_DISABLED: "false"
  METRICS_ENABLED: "true"
  METRICS_NAMESPACE: "lab_portal"
  SWAGGER_ENABLED: "false"

  # Okta OIDC (non-secret fields)
  OKTA_ISSUER: ""
  OKTA_REDIRECT_URI: ""
  OKTA_CLIENT_ID: ""

  # Jira REST (non-secret fields)
  JIRA_URL: ""
  JIRA_DEFAULT_ASSIGNEE: ""
  JIRA_LAB_REQUEST_PROJECT_KEY: "QENG"
  JIRA_LAB_REQUEST_ISSUE_TYPE_ID: ""
  JIRA_CUSTOMFIELD_LAB_REQUEST_TYPE: ""
  JIRA_CUSTOMFIELD_LEAD_QE_TEAM: ""
  JIRA_CUSTOMFIELD_LEAD_RD_TEAM: ""
  JIRA_CUSTOMFIELD_DEADLINE: ""
  JIRA_CUSTOMFIELD_PLANNED_END_DATE: ""
  JIRA_CUSTOMFIELD_HIGH_LEVEL_ESTIMATE: ""
  JIRA_TRANSITION_DONE_ID: ""
  JIRA_TRANSITION_CANCEL_ID: ""

  # Atlassian MCP (non-secret fields)
  ATLASSIAN_MCP_BASE_URL: ""
  ATLASSIAN_MCP_WORKSPACE: ""

  # Per-tool configuration
  RF_CHAMBER_BASE_URL: ""
  SYSTEM_LOCATOR_JIRA_CACHE_TTL: "300"

  # Print requests
  PRINT_REQUESTS_UPLOAD_FOLDER: ""
  PRINT_REQUESTS_CREATE_JIRA: "false"
  PRINT_REQUESTS_DEFAULT_ASSIGNEE: ""
  PRINT_REQUESTS_DEFAULT_PRIORITY: "P4: Low"
  PRINT_REQUESTS_DEFAULT_REQUEST_TYPE: "Other"
  PRINT_REQUESTS_JIRA_CANCEL_TRANSITION_ID: ""
  PRINT_REQUESTS_JIRA_CLOSE_TRANSITION_ID: ""

  # RBAC
  RBAC_ENFORCEMENT_MODE: "warn-only"
  RBAC_ADMIN_GROUPS: ""
  RBAC_LAB_TECH_LEAD_GROUPS: ""
  RBAC_LAB_TECH_GROUPS: ""

  # CSRF + rate limiting
  WTF_CSRF_ENABLED: "true"
  RATELIMIT_DEFAULT: "60 per minute"
  RATELIMIT_STORAGE_URI: "redis://redis:6379/2"

  # CORS
  CORS_ORIGINS: ""

  # Audit log
  AUDIT_LOG_DB_PATH: ""

  # Secure cookie settings
  SESSION_COOKIE_SECURE: "true"
  SESSION_COOKIE_HTTPONLY: "true"
  SESSION_COOKIE_SAMESITE: "Lax"

  # Session backend
  # F22: use Kubernetes service name — NOT localhost.
  SESSION_TYPE: "redis"
  SESSION_LIFETIME_SECONDS: "86400"
  SESSION_KEY_PREFIX: "lab-portal:session:"
  SESSION_REDIS_URL: "redis://redis:6379/1"

  # Redis / Celery
  # F22: use Kubernetes service names — NOT localhost.
  REDIS_URL: "redis://redis:6379/0"
  CELERY_BROKER_URL: "redis://redis:6379/0"
  CELERY_RESULT_BACKEND: "redis://redis:6379/0"
  CELERY_WORKER_CONCURRENCY: "2"
  CELERY_QUEUES: "celery"
  WORKER_PREFETCH_MULTIPLIER: "1"
  RESULT_EXPIRES: "86400"

  # Gunicorn / server
  GUNICORN_WORKERS: "4"
  PORT: "8000"

  # Database
  # DATABASE_URL contains credentials — set it in the SealedSecret (issue #51), NOT here.
  # Example (for reference only — do NOT store in values.yaml):
  #   DATABASE_URL: "postgresql://postgres:<password>@postgres:5432/lab_tech_portal"

  # Object storage (MinIO / S3)
  # F22: use Kubernetes service name — NOT localhost.
  S3_ENDPOINT_URL: "http://minio:9000"
  S3_BUCKET: "lab-portal"
  S3_REGION: "us-east-1"
  OBJECT_STORAGE_BACKEND: "s3"
