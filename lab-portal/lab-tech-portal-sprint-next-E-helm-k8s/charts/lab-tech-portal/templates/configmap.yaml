# Issue #127: QENG-16846: feat(slice-g-part2): Helm ConfigMap for non-secret runtime config
#
# All non-secret env vars from config.py BaseConfig are mapped here.
# Variables matching SECRET_KEY_FIELD_PATTERN = re.compile(r"(SECRET|PASSWORD|PAT|TOKEN|KEY)$", re.IGNORECASE)
# are intentionally ABSENT — they belong to SealedSecrets (issue #51).
#
# Absent from this ConfigMap (managed via SealedSecrets):
#   SECRET_KEY, OKTA_CLIENT_SECRET, JIRA_PAT,
#   S3_ACCESS_KEY, S3_SECRET_KEY, ATLASSIAN_MCP_TOKEN, SYSTEM_LOCATOR_DELETE_PIN
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "lab-tech-portal.configMapName" . }}
  labels:
    {{- include "lab-tech-portal.labels" . | nindent 4 }}
data:
  # ── Flask core ───────────────────────────────────────────────────────────────
  FLASK_ENV: {{ .Values.config.FLASK_ENV | quote }}
  DATA_DIR: {{ .Values.config.DATA_DIR | quote }}
  LOG_LEVEL: {{ .Values.config.LOG_LEVEL | quote }}
  LOG_FORMAT: {{ .Values.config.LOG_FORMAT | quote }}
  STRUCTLOG_ENABLED: {{ .Values.config.STRUCTLOG_ENABLED | quote }}
  LOGIN_DISABLED: {{ .Values.config.LOGIN_DISABLED | quote }}
  METRICS_ENABLED: {{ .Values.config.METRICS_ENABLED | quote }}
  METRICS_NAMESPACE: {{ .Values.config.METRICS_NAMESPACE | quote }}
  SWAGGER_ENABLED: {{ .Values.config.SWAGGER_ENABLED | quote }}

  # ── Okta OIDC (non-secret) ───────────────────────────────────────────────────
  OKTA_ISSUER: {{ .Values.config.OKTA_ISSUER | quote }}
  OKTA_REDIRECT_URI: {{ .Values.config.OKTA_REDIRECT_URI | quote }}
  OKTA_CLIENT_ID: {{ .Values.config.OKTA_CLIENT_ID | quote }}

  # ── Jira REST (non-secret) ───────────────────────────────────────────────────
  JIRA_URL: {{ .Values.config.JIRA_URL | quote }}
  JIRA_DEFAULT_ASSIGNEE: {{ .Values.config.JIRA_DEFAULT_ASSIGNEE | quote }}
  JIRA_LAB_REQUEST_PROJECT_KEY: {{ .Values.config.JIRA_LAB_REQUEST_PROJECT_KEY | quote }}
  JIRA_LAB_REQUEST_ISSUE_TYPE_ID: {{ .Values.config.JIRA_LAB_REQUEST_ISSUE_TYPE_ID | quote }}
  JIRA_CUSTOMFIELD_LAB_REQUEST_TYPE: {{ .Values.config.JIRA_CUSTOMFIELD_LAB_REQUEST_TYPE | quote }}
  JIRA_CUSTOMFIELD_LEAD_QE_TEAM: {{ .Values.config.JIRA_CUSTOMFIELD_LEAD_QE_TEAM | quote }}
  JIRA_CUSTOMFIELD_LEAD_RD_TEAM: {{ .Values.config.JIRA_CUSTOMFIELD_LEAD_RD_TEAM | quote }}
  JIRA_CUSTOMFIELD_DEADLINE: {{ .Values.config.JIRA_CUSTOMFIELD_DEADLINE | quote }}
  JIRA_CUSTOMFIELD_PLANNED_END_DATE: {{ .Values.config.JIRA_CUSTOMFIELD_PLANNED_END_DATE | quote }}
  JIRA_CUSTOMFIELD_HIGH_LEVEL_ESTIMATE: {{ .Values.config.JIRA_CUSTOMFIELD_HIGH_LEVEL_ESTIMATE | quote }}
  JIRA_TRANSITION_DONE_ID: {{ .Values.config.JIRA_TRANSITION_DONE_ID | quote }}
  JIRA_TRANSITION_CANCEL_ID: {{ .Values.config.JIRA_TRANSITION_CANCEL_ID | quote }}

  # ── Atlassian MCP (non-secret) ───────────────────────────────────────────────
  ATLASSIAN_MCP_BASE_URL: {{ .Values.config.ATLASSIAN_MCP_BASE_URL | quote }}
  ATLASSIAN_MCP_WORKSPACE: {{ .Values.config.ATLASSIAN_MCP_WORKSPACE | quote }}

  # ── Per-tool configuration ───────────────────────────────────────────────────
  RF_CHAMBER_BASE_URL: {{ .Values.config.RF_CHAMBER_BASE_URL | quote }}
  SYSTEM_LOCATOR_JIRA_CACHE_TTL: {{ .Values.config.SYSTEM_LOCATOR_JIRA_CACHE_TTL | quote }}

  # ── Print requests ───────────────────────────────────────────────────────────
  PRINT_REQUESTS_UPLOAD_FOLDER: {{ .Values.config.PRINT_REQUESTS_UPLOAD_FOLDER | quote }}
  PRINT_REQUESTS_CREATE_JIRA: {{ .Values.config.PRINT_REQUESTS_CREATE_JIRA | quote }}
  PRINT_REQUESTS_DEFAULT_ASSIGNEE: {{ .Values.config.PRINT_REQUESTS_DEFAULT_ASSIGNEE | quote }}
  PRINT_REQUESTS_DEFAULT_PRIORITY: {{ .Values.config.PRINT_REQUESTS_DEFAULT_PRIORITY | quote }}
  PRINT_REQUESTS_DEFAULT_REQUEST_TYPE: {{ .Values.config.PRINT_REQUESTS_DEFAULT_REQUEST_TYPE | quote }}
  PRINT_REQUESTS_JIRA_CANCEL_TRANSITION_ID: {{ .Values.config.PRINT_REQUESTS_JIRA_CANCEL_TRANSITION_ID | quote }}
  PRINT_REQUESTS_JIRA_CLOSE_TRANSITION_ID: {{ .Values.config.PRINT_REQUESTS_JIRA_CLOSE_TRANSITION_ID | quote }}

  # ── RBAC ─────────────────────────────────────────────────────────────────────
  RBAC_ENFORCEMENT_MODE: {{ .Values.config.RBAC_ENFORCEMENT_MODE | quote }}
  RBAC_ADMIN_GROUPS: {{ .Values.config.RBAC_ADMIN_GROUPS | quote }}
  RBAC_LAB_TECH_LEAD_GROUPS: {{ .Values.config.RBAC_LAB_TECH_LEAD_GROUPS | quote }}
  RBAC_LAB_TECH_GROUPS: {{ .Values.config.RBAC_LAB_TECH_GROUPS | quote }}

  # ── CSRF + rate limiting ─────────────────────────────────────────────────────
  WTF_CSRF_ENABLED: {{ .Values.config.WTF_CSRF_ENABLED | quote }}
  RATELIMIT_DEFAULT: {{ .Values.config.RATELIMIT_DEFAULT | quote }}
  RATELIMIT_STORAGE_URI: {{ .Values.config.RATELIMIT_STORAGE_URI | quote }}

  # ── CORS ─────────────────────────────────────────────────────────────────────
  CORS_ORIGINS: {{ .Values.config.CORS_ORIGINS | quote }}

  # ── Audit log ────────────────────────────────────────────────────────────────
  AUDIT_LOG_DB_PATH: {{ .Values.config.AUDIT_LOG_DB_PATH | quote }}

  # ── Secure cookie settings ───────────────────────────────────────────────────
  SESSION_COOKIE_SECURE: {{ .Values.config.SESSION_COOKIE_SECURE | quote }}
  SESSION_COOKIE_HTTPONLY: {{ .Values.config.SESSION_COOKIE_HTTPONLY | quote }}
  SESSION_COOKIE_SAMESITE: {{ .Values.config.SESSION_COOKIE_SAMESITE | quote }}

  # ── Session backend ──────────────────────────────────────────────────────────
  # F22: service URLs use Kubernetes service names (not localhost).
  SESSION_TYPE: {{ .Values.config.SESSION_TYPE | quote }}
  SESSION_LIFETIME_SECONDS: {{ .Values.config.SESSION_LIFETIME_SECONDS | quote }}
  SESSION_KEY_PREFIX: {{ .Values.config.SESSION_KEY_PREFIX | quote }}
  SESSION_REDIS_URL: {{ .Values.config.SESSION_REDIS_URL | quote }}

  # ── Redis / Celery ───────────────────────────────────────────────────────────
  # F22: use Kubernetes service names — NOT localhost.
  REDIS_URL: {{ .Values.config.REDIS_URL | quote }}
  CELERY_BROKER_URL: {{ .Values.config.CELERY_BROKER_URL | quote }}
  CELERY_RESULT_BACKEND: {{ .Values.config.CELERY_RESULT_BACKEND | quote }}
  CELERY_WORKER_CONCURRENCY: {{ .Values.config.CELERY_WORKER_CONCURRENCY | quote }}
  CELERY_QUEUES: {{ .Values.config.CELERY_QUEUES | quote }}
  WORKER_PREFETCH_MULTIPLIER: {{ .Values.config.WORKER_PREFETCH_MULTIPLIER | quote }}
  RESULT_EXPIRES: {{ .Values.config.RESULT_EXPIRES | quote }}

  # ── Gunicorn / server ────────────────────────────────────────────────────────
  GUNICORN_WORKERS: {{ .Values.config.GUNICORN_WORKERS | quote }}
  PORT: {{ .Values.config.PORT | quote }}

  # ── Database ─────────────────────────────────────────────────────────────────
  # DATABASE_URL contains the Postgres password — it must be set in the SealedSecret
  # (issue #51), not the ConfigMap. It is intentionally absent here.

  # ── Object storage (MinIO / S3) ──────────────────────────────────────────────
  # F22: MinIO endpoint uses Kubernetes service name — NOT localhost.
  S3_ENDPOINT_URL: {{ .Values.config.S3_ENDPOINT_URL | quote }}
  S3_BUCKET: {{ .Values.config.S3_BUCKET | quote }}
  S3_REGION: {{ .Values.config.S3_REGION | quote }}
  OBJECT_STORAGE_BACKEND: {{ .Values.config.OBJECT_STORAGE_BACKEND | quote }}
