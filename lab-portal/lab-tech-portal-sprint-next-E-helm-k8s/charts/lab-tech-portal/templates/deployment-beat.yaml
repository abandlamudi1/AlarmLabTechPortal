# Issue #125: QENG-16846: feat(slice-g-part2): Helm Deployment — Celery beat scheduler
#
# Beat MUST be a singleton (replicas: 1, fixed). Running multiple beat instances
# causes duplicate scheduled task execution. Do NOT expose this replica count
# in values.yaml; it is intentionally hardcoded to 1.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lab-tech-portal.fullname" . }}-beat
  labels:
    {{- include "lab-tech-portal.labels" . | nindent 4 }}
    app.kubernetes.io/component: beat
spec:
  # Beat must be a singleton — do not scale beyond 1.
  replicas: 1
  selector:
    matchLabels:
      {{- include "lab-tech-portal.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: beat
  template:
    metadata:
      labels:
        {{- include "lab-tech-portal.labels" . | nindent 8 }}
        app.kubernetes.io/component: beat
      annotations:
        # ConfigMap checksum — triggers a rolling restart when the ConfigMap changes.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      containers:
        - name: beat
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - celery
            - "-A"
            - "app"
            - "beat"
            - "--loglevel=info"
          envFrom:
            # Non-secret runtime configuration.
            - configMapRef:
                name: {{ include "lab-tech-portal.configMapName" . }}
            # Secret values managed via SealedSecrets (issue #51).
            - secretRef:
                name: {{ include "lab-tech-portal.secretName" . }}
          resources:
            requests:
              cpu: {{ .Values.resources.beat.requests.cpu }}
              memory: {{ .Values.resources.beat.requests.memory }}
            limits:
              cpu: {{ .Values.resources.beat.limits.cpu }}
              memory: {{ .Values.resources.beat.limits.memory }}
      restartPolicy: Always
