[pytest]
# Pytest configuration for Lab Tech Portal

# Custom markers
markers =
    creates_jira_tickets: Tests that create real Jira tickets (deselect with '-m "not creates_jira_tickets"')
    integration: Integration tests that may hit external services
    slow: Tests that take a long time to run
    unit: Pure unit tests — no network, no external services required

# Default test options
addopts =
    -v
    --tb=short
    -m "not creates_jira_tickets"
    --strict-markers

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Directories to ignore
testpaths = tests
norecursedirs = .git .venv __pycache__ node_modules

# Output options
console_output_style = progress

[coverage:run]
# Track coverage for business logic packages (Slice H launch criterion).
source = tools, services, tasks

[coverage:report]
# Per-package thresholds are enforced in CI (ci.yml) via separate
# `coverage report --include=<pkg>/* --fail-under=70` invocations against the
# single test run's data file. A global `fail_under` here is intentionally
# OMITTED — it would gate the combined coverage of all sources, which masks
# regressions inside a single package and collides with the TODO #133 intent
# of deferring services/ until it reaches 70%.
show_missing = True
precision = 1
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
