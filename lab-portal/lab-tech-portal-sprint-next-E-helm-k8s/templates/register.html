{% extends 'base.html' %}

{% block title %}Create Account — Lab Tech Portal{% endblock %}

{% block content %}
<div class="login-wrap">
    <div class="card login-card">
        <div class="login-header">
            <h1 class="login-title">Create Account</h1>
            <p class="login-sub">Lab Tech Portal</p>
        </div>

        {% if error %}
        <div class="notice notice-error">{{ error }}</div>
        {% endif %}

        <form method="post" action="{{ url_for('register') }}" class="login-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-field">
                <label for="username">Username</label>
                <input id="username" name="username" type="text" autocomplete="username"
                       autofocus required value="{{ form.username or '' }}">
            </div>
            <div class="form-field">
                <label for="display_name">Display Name</label>
                <input id="display_name" name="display_name" type="text"
                       required value="{{ form.display_name or '' }}">
            </div>
            <div class="form-field">
                <label for="email">Email</label>
                <input id="email" name="email" type="email" autocomplete="email"
                       required value="{{ form.email or '' }}">
            </div>
            <div class="form-field">
                <label for="password">Password</label>
                <input id="password" name="password" type="password" autocomplete="new-password" required>
            </div>
            <div class="form-field">
                <label for="confirm_password">Confirm Password</label>
                <input id="confirm_password" name="confirm_password" type="password"
                       autocomplete="new-password" required>
            </div>
            <button class="btn" type="submit" style="width:100%;">Create Account</button>
        </form>

        <p style="margin-top:16px; text-align:center; font-size:0.875rem; color:var(--muted-text);">
            Already have an account? <a href="{{ url_for('login') }}">Sign in</a>
        </p>
    </div>
</div>
{% endblock %}
